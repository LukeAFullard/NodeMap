<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Builder App - Phase 0 Spike</title>
    <!-- vis-network CSS & JS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <!-- PapaParse and SheetJS for Bulk Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Tailwind for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        #network-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        #svg-overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20; /* SVG sits above the vis-network canvas */
            pointer-events: none; /* Let clicks pass through to the graph by default */
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- vis-network will mount here -->
        <div id="network-canvas"></div>

        <!-- SVG overlay for tactical zones and freehand annotations -->
        <svg id="svg-overlay" xmlns="http://www.w3.org/2000/svg">
            <!-- Polygons will be injected here dynamically -->
        </svg>

        <!-- Floating UI -->
        <div class="absolute top-4 left-4 z-50 bg-white p-4 rounded shadow">
            <h1 class="font-bold text-lg mb-2">Phase 1 MVP</h1>
            <button id="btn-physics" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Toggle Physics</button>
            <select id="mode-switch" class="mb-2 w-full p-1 border rounded text-sm">
                <option value="systems">Systems Mode</option>
                <option value="tactics">Tactics Mode</option>
            </select>
            <select id="pitch-switch" class="mb-2 w-full p-1 border rounded text-sm hidden">
                <option value="none">No Pitch</option>
                <option value="soccer">Soccer</option>
                <option value="rugby">Rugby</option>
                <option value="hockey">Hockey</option>
                <option value="cricket">Cricket</option>
            </select>
            <button id="btn-add-node" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Add Node</button>
            <div class="flex gap-2 mb-2">
                <button id="btn-add-edge" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-sm w-1/2">Add Edge</button>
                <select id="edge-style" class="w-1/2 p-1 border rounded text-sm">
                    <option value="solid">Solid</option>
                    <option value="dashed">Dashed</option>
                    <option value="curved">Curved</option>
                </select>
            </div>
            <button id="btn-add-zone" class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Add Zone</button>
            <button id="btn-toggle-lock" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Lock/Unlock Selected</button>
            <div class="flex gap-2 mb-2 mt-2">
                <button id="btn-undo" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-1 px-3 rounded text-sm w-1/2">Undo</button>
                <button id="btn-redo" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-1 px-3 rounded text-sm w-1/2">Redo</button>
            </div>
            <div class="h-px bg-gray-300 my-2"></div>
            <button id="btn-export-json" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Export JSON</button>
            <button id="btn-import-json" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Import JSON</button>
            <button id="btn-export-png" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Export PNG</button>
            <div class="h-px bg-gray-300 my-2"></div>
            <button id="btn-bulk-import" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Bulk Import (CSV/XLSX)</button>

            <input type="file" id="input-import-json" accept=".json" class="hidden" />
            <input type="file" id="input-bulk-import" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" class="hidden" />
        </div>

        <!-- Contextual Side Panel -->
        <div id="side-panel" class="absolute top-0 right-0 h-full w-64 bg-white shadow-lg transform translate-x-full transition-transform duration-300 ease-in-out z-50 p-4 border-l border-gray-200">
            <h2 id="panel-title" class="font-bold text-lg mb-4">Edit Element</h2>
            <input type="hidden" id="edit-id" />
            <input type="hidden" id="edit-type" />

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Label</label>
                <input type="text" id="edit-label" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div id="edit-color-group" class="mb-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Color / Group</label>
                <input type="text" id="edit-color" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="#ff0000 or group name" />
            </div>

            <div class="flex justify-between mt-6">
                <button id="btn-panel-cancel" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded text-sm w-1/2 mr-2">Cancel</button>
                <button id="btn-panel-save" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm w-1/2 ml-2">Save</button>
            </div>
        </div>

        <!-- Column Mapping Modal -->
        <div id="mapping-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <div class="mt-3 text-center">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">Map Columns</h3>
                    <div class="mt-2 px-7 py-3 text-left">
                        <div id="mapping-errors" class="text-red-500 text-sm mb-2 hidden"></div>
                        <form id="mapping-form">
                            <!-- Injected fields will go here -->
                            <div id="mapping-fields" class="space-y-3"></div>
                        </form>
                    </div>
                    <div class="items-center px-4 py-3">
                        <button id="btn-commit-import" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
                            Validate & Import
                        </button>
                        <button id="btn-cancel-import" class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Init vis-network with mock data ---

        const nodes = new vis.DataSet([
            { id: 1, label: 'Node 1 (Anchor)', fixed: true, x: 0, y: -100 },
            { id: 2, label: 'Node 2' },
            { id: 3, label: 'Node 3' },
            { id: 4, label: 'Node 4' },
            { id: 5, label: 'Node 5' }
        ]);

        const edges = new vis.DataSet([
            { from: 1, to: 2, dashes: true, arrows: 'to' }, // Testing dashed arrows
            { from: 1, to: 3, smooth: { type: 'curvedCW' }, arrows: 'to' }, // Testing curved lines
            { from: 2, to: 4 },
            { from: 2, to: 5 }
        ]);

        const container = document.getElementById('network-canvas');
        const data = { nodes, edges };

        let physicsEnabled = true;
        const options = {
            interaction: { dragNodes: true, hover: true },
            manipulation: {
                enabled: false,
                addNode: function(nodeData, callback) {
                    pushHistory();
                    nodeData.label = nodeData.label || 'New Node';
                    callback(nodeData);
                },
                addEdge: function(edgeData, callback) {
                    pushHistory();
                    const style = document.getElementById('edge-style').value;
                    edgeData.arrows = 'to';
                    if (style === 'dashed') {
                        edgeData.dashes = true;
                    } else if (style === 'curved') {
                        edgeData.smooth = { type: 'curvedCW' };
                    }
                    callback(edgeData);
                }
            },
            physics: {
                enabled: physicsEnabled,
                barnesHut: { gravitationalConstant: -2000 }
            }
        };

        const network = new vis.Network(container, data, options);

        // Toggle physics button
        document.getElementById('btn-physics').addEventListener('click', (e) => {
            physicsEnabled = !physicsEnabled;
            network.setOptions({ physics: { enabled: physicsEnabled } });

            const physicsBtn = e.target;
            if (physicsEnabled) {
                physicsBtn.classList.remove('bg-gray-500');
                physicsBtn.classList.add('bg-blue-500');
            } else {
                physicsBtn.classList.remove('bg-blue-500');
                physicsBtn.classList.add('bg-gray-500');
            }
        });

        // Mode Switching
        let currentPitchUrl = null;
        let currentPitchImage = null;

        function applyPitchBackground() {
            if (currentPitchUrl) {
                URL.revokeObjectURL(currentPitchUrl);
                currentPitchUrl = null;
            }
            currentPitchImage = null;

            const pitch = document.getElementById('pitch-switch').value;
            if (pitch === 'none' || document.getElementById('mode-switch').value !== 'tactics') {
                network.redraw(); // force a redraw to clear the background
                return;
            }

            let svgStr = '';
            if (pitch === 'soccer') {
                svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" width="1050" height="680">
                    <rect width="1050" height="680" fill="#4ade80" />
                    <rect x="10" y="10" width="1030" height="660" fill="none" stroke="white" stroke-width="4" />
                    <line x1="525" y1="10" x2="525" y2="670" stroke="white" stroke-width="4" />
                    <circle cx="525" cy="340" r="91.5" fill="none" stroke="white" stroke-width="4" />
                    <rect x="10" y="138.5" width="165" height="403" fill="none" stroke="white" stroke-width="4" />
                    <rect x="875" y="138.5" width="165" height="403" fill="none" stroke="white" stroke-width="4" />
                    <rect x="10" y="248.5" width="55" height="183" fill="none" stroke="white" stroke-width="4" />
                    <rect x="985" y="248.5" width="55" height="183" fill="none" stroke="white" stroke-width="4" />
                </svg>`;
            } else if (pitch === 'rugby') {
                svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700">
                    <rect width="1440" height="700" fill="#4ade80" />
                    <rect x="10" y="10" width="1420" height="680" fill="none" stroke="white" stroke-width="4" />
                    <line x1="230" y1="10" x2="230" y2="690" stroke="white" stroke-width="4" />
                    <line x1="1210" y1="10" x2="1210" y2="690" stroke="white" stroke-width="4" />
                    <line x1="450" y1="10" x2="450" y2="690" stroke="white" stroke-width="4" />
                    <line x1="990" y1="10" x2="990" y2="690" stroke="white" stroke-width="4" />
                    <line x1="720" y1="10" x2="720" y2="690" stroke="white" stroke-width="4" />
                    <line x1="620" y1="10" x2="620" y2="690" stroke="white" stroke-width="4" stroke-dasharray="20,20" />
                    <line x1="820" y1="10" x2="820" y2="690" stroke="white" stroke-width="4" stroke-dasharray="20,20" />
                </svg>`;
            } else if (pitch === 'hockey') {
                svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 914 550" width="914" height="550">
                    <rect width="914" height="550" fill="#2563eb" />
                    <rect x="10" y="10" width="894" height="530" fill="none" stroke="white" stroke-width="4" />
                    <line x1="457" y1="10" x2="457" y2="540" stroke="white" stroke-width="4" />
                    <line x1="240" y1="10" x2="240" y2="540" stroke="white" stroke-width="4" />
                    <line x1="674" y1="10" x2="674" y2="540" stroke="white" stroke-width="4" />
                    <path d="M 156.3 10 A 146.3 146.3 0 0 0 156.3 540" fill="none" stroke="white" stroke-width="4" />
                    <path d="M 757.7 10 A 146.3 146.3 0 0 1 757.7 540" fill="none" stroke="white" stroke-width="4" />
                </svg>`;
            } else if (pitch === 'cricket') {
                svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 1370" width="1370" height="1370">
                    <rect width="1370" height="1370" fill="#4ade80" />
                    <circle cx="685" cy="685" r="670" fill="none" stroke="white" stroke-width="4" />
                    <circle cx="685" cy="685" r="274" fill="none" stroke="white" stroke-width="4" stroke-dasharray="10,10" />
                    <rect x="670" y="584" width="30" height="201" fill="#d4d4d8" />
                </svg>`;
            }

            if (svgStr) {
                const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
                currentPitchUrl = URL.createObjectURL(blob);
                currentPitchImage = new Image();
                currentPitchImage.onload = () => {
                    network.redraw();
                };
                currentPitchImage.src = currentPitchUrl;
            }
        }

        // Draw pitch on canvas before drawing nodes
        network.on("beforeDrawing", function(ctx) {
            if (currentPitchImage && currentPitchImage.complete && document.getElementById('mode-switch').value === 'tactics') {
                // Determine appropriate scaling to center the image on the canvas.
                // It's already drawn in canvas coordinates (pan/zoom applied automatically by ctx),
                // so we want it centered at (0, 0)
                const imgW = currentPitchImage.width;
                const imgH = currentPitchImage.height;
                ctx.drawImage(currentPitchImage, -imgW / 2, -imgH / 2, imgW, imgH);
            }
        });

        function setMode(mode, backgroundUrl = null) {
            const physicsBtn = document.getElementById('btn-physics');
            const pitchSwitch = document.getElementById('pitch-switch');
            if (mode === 'tactics') {
                physicsEnabled = false;
                network.setOptions({ physics: { enabled: false } });
                physicsBtn.classList.remove('bg-blue-500');
                physicsBtn.classList.add('bg-gray-500');
                pitchSwitch.classList.remove('hidden');

                if (backgroundUrl) {
                    if (currentPitchUrl) {
                        URL.revokeObjectURL(currentPitchUrl);
                        currentPitchUrl = null;
                    }
                    currentPitchImage = new Image();
                    currentPitchImage.onload = () => {
                        network.redraw();
                    };
                    currentPitchImage.src = backgroundUrl;
                } else {
                    applyPitchBackground();
                }
            } else {
                physicsEnabled = true;
                network.setOptions({ physics: { enabled: true } });
                physicsBtn.classList.remove('bg-gray-500');
                physicsBtn.classList.add('bg-blue-500');
                pitchSwitch.classList.add('hidden');

                if (currentPitchUrl) {
                    URL.revokeObjectURL(currentPitchUrl);
                    currentPitchUrl = null;
                }
                currentPitchImage = null;
                network.redraw();
            }
        }

        document.getElementById('mode-switch').addEventListener('change', (e) => {
            setMode(e.target.value);
        });

        document.getElementById('pitch-switch').addEventListener('change', applyPitchBackground);

        // Hook up Undo/Redo Buttons
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-redo').addEventListener('click', redo);

        // Add Node / Add Edge
        document.getElementById('btn-add-node').addEventListener('click', () => {
            network.addNodeMode();
        });

        document.getElementById('btn-add-edge').addEventListener('click', () => {
            network.addEdgeMode();
        });

        // Add Zone
        let isDrawingZone = false;
        let currentZonePoints = [];

        document.getElementById('btn-add-zone').addEventListener('click', (e) => {
            isDrawingZone = !isDrawingZone;
            const btn = e.target;
            if (isDrawingZone) {
                btn.classList.remove('bg-yellow-500', 'hover:bg-yellow-700');
                btn.classList.add('bg-red-500', 'hover:bg-red-700');
                btn.textContent = 'Finish Zone (Double Click)';
                currentZonePoints = [];
            } else {
                btn.classList.add('bg-yellow-500', 'hover:bg-yellow-700');
                btn.classList.remove('bg-red-500', 'hover:bg-red-700');
                btn.textContent = 'Add Zone';
                if (currentZonePoints.length > 2) {
                    pushHistory();
                    zones.add({
                        id: 'zone-' + Date.now(),
                        points: currentZonePoints,
                        color: 'rgba(239, 68, 68, 0.2)', // Tailwind red-500 semi-transparent
                        stroke: '#ef4444'
                    });
                    renderZoneOverlay();
                }
                currentZonePoints = [];
            }
        });

        network.on("click", function (params) {
            if (isDrawingZone && params.pointer) {
                currentZonePoints.push([params.pointer.canvas.x, params.pointer.canvas.y]);

                // Draw temporary preview point
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', params.pointer.canvas.x);
                circle.setAttribute('cy', params.pointer.canvas.y);
                circle.setAttribute('r', '4');
                circle.setAttribute('fill', '#ef4444');
                // Temporary preview points belong to a specific group or class so they can be cleaned up
                circle.classList.add('temp-zone-point');
                svgOverlay.appendChild(circle);
            }
        });

        network.on("doubleClick", function (params) {
            if (isDrawingZone) {
                document.getElementById('btn-add-zone').click(); // Toggle off and save
            }
        });

        network.on("dragStart", function(params) {
            if (params.nodes && params.nodes.length > 0) {
                pushHistory();
            }
        });

        // Toggle Node Lock
        document.getElementById('btn-toggle-lock').addEventListener('click', () => {
            const selectedNodeIds = network.getSelectedNodes();
            if (selectedNodeIds.length === 0) return;

            pushHistory();
            const updates = selectedNodeIds.map(id => {
                const node = nodes.get(id);
                // In vis-network, 'fixed' can be a boolean or an object {x: boolean, y: boolean}
                const isFixed = node.fixed === true || (node.fixed && node.fixed.x && node.fixed.y);
                return {
                    id: id,
                    fixed: { x: !isFixed, y: !isFixed }
                };
            });
            nodes.update(updates);
        });

        // --- 2. SVG Overlay Logic ---

        const svgOverlay = document.getElementById('svg-overlay');

        // Mock zone data (using internal vis-network canvas coordinates)
        const zones = new vis.DataSet([
            {
                id: 'zone-1',
                points: [[-150, -50], [150, -50], [100, 150], [-100, 150]], // Polygon vertices
                color: 'rgba(239, 68, 68, 0.2)', // Tailwind red-500 semi-transparent
                stroke: '#ef4444'
            }
        ]);

        // Render the zones as SVG polygons
        function renderZoneOverlay() {
            // Remove existing polygons and temporary points
            Array.from(svgOverlay.querySelectorAll('polygon, .temp-zone-point')).forEach(el => el.remove());

            zones.get().forEach(zone => {
                const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                // The points are in Canvas space, so we store them raw. We transform the whole SVG later.
                poly.setAttribute('points', zone.points.map(p => p.join(',')).join(' '));
                poly.setAttribute('fill', zone.color);
                poly.setAttribute('stroke', zone.stroke);
                poly.setAttribute('stroke-width', '2');
                // If we want the zone to be clickable later, we'd enable pointer-events on the polygon

                svgOverlay.appendChild(poly);
            });

            syncSvgTransform(); // apply current viewport transform immediately
        }

        // Sync the SVG layer's transform to match the vis-network canvas viewport
        function syncSvgTransform() {
            // Get current scale (zoom) and translation (pan) from the network
            const scale = network.getScale();
            const viewPosition = network.getViewPosition();

            // vis-network viewport center is relative to the DOM container center.
            const containerRect = container.getBoundingClientRect();
            const centerX = containerRect.width / 2;
            const centerY = containerRect.height / 2;

            // Calculate translation for the SVG.
            // The canvas coordinates are mapped to DOM coordinates via:
            // domX = (canvasX - viewPosition.x) * scale + centerX
            // Therefore, the global transform for the SVG element is:
            // translate(centerX - viewPosition.x * scale, centerY - viewPosition.y * scale) scale(scale)

            const translateX = centerX - (viewPosition.x * scale);
            const translateY = centerY - (viewPosition.y * scale);

            const transformString = `translate(${translateX}px, ${translateY}px) scale(${scale})`;

            // We apply this to a <g> tag inside the SVG normally, or directly via CSS transform on the SVG if its origin is 0,0
            svgOverlay.style.transformOrigin = '0 0';
            svgOverlay.style.transform = transformString;
        }

        // Hook up vis-network events to keep the SVG overlay perfectly in sync
        network.on("zoom", syncSvgTransform);
        network.on("dragging", syncSvgTransform);
        network.on("dragEnd", syncSvgTransform);
        network.on("animation", syncSvgTransform); // needed if physics auto-pans the camera

        // Initial render
        renderZoneOverlay();
        // The network might auto-fit on load, so we need to wait a tick for the initial layout
        network.once("afterDrawing", () => {
             syncSvgTransform();
        });

        // --- Undo / Redo Engine ---
        const historyStack = { past: [], future: [] };

        function snapshot() {
            // Get current positions to save exact layout if physics is off
            const positions = network.getPositions();
            const currentNodes = nodes.get().map(node => {
                if (positions[node.id]) {
                    return { ...node, x: positions[node.id].x, y: positions[node.id].y };
                }
                return node;
            });
            return JSON.stringify({ nodes: currentNodes, edges: edges.get(), zones: zones.get() });
        }

        function pushHistory() {
            historyStack.past.push(snapshot());
            historyStack.future = [];
            if (historyStack.past.length > 50) historyStack.past.shift();
        }

        function undo() {
            if (!historyStack.past.length) return;
            historyStack.future.push(snapshot());
            restoreSnapshot(historyStack.past.pop());
        }

        function redo() {
            if (!historyStack.future.length) return;
            historyStack.past.push(snapshot());
            restoreSnapshot(historyStack.future.pop());
        }

        function restoreSnapshot(snap) {
            const state = JSON.parse(snap);
            nodes.clear(); edges.clear(); zones.clear();
            nodes.add(state.nodes); edges.add(state.edges); zones.add(state.zones);
            renderZoneOverlay();
        }

        // --- Contextual Side Panel Logic ---
        const sidePanel = document.getElementById('side-panel');

        function openSidePanel(type, id) {
            const item = type === 'node' ? nodes.get(id) : edges.get(id);
            if (!item) return;

            document.getElementById('edit-id').value = id;
            document.getElementById('edit-type').value = type;
            document.getElementById('panel-title').textContent = type === 'node' ? 'Edit Node' : 'Edit Edge';
            document.getElementById('edit-label').value = item.label || '';

            if (type === 'node') {
                document.getElementById('edit-color-group').classList.remove('hidden');
                document.getElementById('edit-color').value = item.group || item.color || '';
            } else {
                document.getElementById('edit-color-group').classList.add('hidden');
            }

            sidePanel.classList.remove('translate-x-full');
        }

        function closeSidePanel() {
            sidePanel.classList.add('translate-x-full');
        }

        network.on("selectNode", function (params) {
            if (params.nodes.length === 1) {
                openSidePanel('node', params.nodes[0]);
            } else {
                closeSidePanel();
            }
        });

        network.on("selectEdge", function (params) {
            if (params.nodes.length === 0 && params.edges.length === 1) {
                openSidePanel('edge', params.edges[0]);
            } else if (params.nodes.length !== 1) {
                closeSidePanel();
            }
        });

        network.on("deselectNode", closeSidePanel);
        network.on("deselectEdge", closeSidePanel);

        document.getElementById('btn-panel-cancel').addEventListener('click', closeSidePanel);

        document.getElementById('btn-panel-save').addEventListener('click', () => {
            const id = document.getElementById('edit-id').value;
            const type = document.getElementById('edit-type').value;
            const label = document.getElementById('edit-label').value;
            const colorGroup = document.getElementById('edit-color').value;

            if (!id || !type) return;

            pushHistory();

            if (type === 'node') {
                const updateData = { id: id, label: label };
                // A simplistic check: if it looks like hex, set color, else set group
                if (colorGroup.startsWith('#') || colorGroup.startsWith('rgb')) {
                    updateData.color = colorGroup;
                    updateData.group = null;
                } else if (colorGroup) {
                    updateData.group = colorGroup;
                }
                nodes.update(updateData);
            } else if (type === 'edge') {
                edges.update({ id: id, label: label });
            }

            closeSidePanel();
        });


        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            // Only trigger if we aren't typing in an input/textarea
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

            // Undo / Redo
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            }

            // Delete Selection
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const selectedNodes = network.getSelectedNodes();
                const selectedEdges = network.getSelectedEdges();

                if (selectedNodes.length > 0 || selectedEdges.length > 0) {
                    e.preventDefault();
                    pushHistory();
                    network.deleteSelected();
                }
            }
        });

        // --- 3. JSON Export & Import Logic ---

        function exportGraph() {
            // Get positions to save them properly
            const positions = network.getPositions();

            // Map nodes to include their x and y if physics is disabled
            const currentNodes = nodes.get().map(node => {
                if (positions[node.id]) {
                    return { ...node, x: positions[node.id].x, y: positions[node.id].y };
                }
                return node;
            });

            const currentMode = document.getElementById('mode-switch').value;

            const payload = {
                version: 1,
                mode: currentMode,
                nodes: currentNodes,
                edges: edges.get(),
                isPhysicsEnabled: physicsEnabled
            };

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.setAttribute("href", url);
            a.setAttribute("download", "graph_workspace.json");
            document.body.appendChild(a);
            a.click();
            a.remove();

            window.URL.revokeObjectURL(url);
        }

        function importGraph(jsonString) {
            try {
                const payload = JSON.parse(jsonString);

                if (payload.version !== 1) {
                    console.warn("Importing unversioned or different version graph.", payload.version);
                }

                pushHistory();
                nodes.clear();
                edges.clear();

                nodes.add(payload.nodes);
                edges.add(payload.edges);

                // Restore mode
                if (payload.mode) {
                    document.getElementById('mode-switch').value = payload.mode;
                    setMode(payload.mode);
                }

                // If the physics was saved as false (maybe they manually turned it off in systems mode)
                if (payload.isPhysicsEnabled === false) {
                    physicsEnabled = false;
                    network.setOptions({ physics: { enabled: false } });
                } else if (payload.isPhysicsEnabled === true) {
                    physicsEnabled = true;
                    network.setOptions({ physics: { enabled: true } });
                }

                // Keep the physics button visually in sync if necessary.
                // Currently it has no active/inactive styling, but if it did, we'd update it here.
                const physicsBtn = document.getElementById('btn-physics');
                if (physicsEnabled) {
                    physicsBtn.classList.remove('bg-gray-500');
                    physicsBtn.classList.add('bg-blue-500');
                } else {
                    physicsBtn.classList.remove('bg-blue-500');
                    physicsBtn.classList.add('bg-gray-500');
                }

            } catch (error) {
                console.error("Failed to import JSON", error);
                alert("Failed to parse JSON file.");
            }
        }

        document.getElementById('btn-export-json').addEventListener('click', exportGraph);

        document.getElementById('btn-import-json').addEventListener('click', () => {
            document.getElementById('input-import-json').click();
        });

        document.getElementById('input-import-json').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    importGraph(e.target.result);
                    // Reset input
                    event.target.value = '';
                };
                reader.readAsText(file);
            }
        });

        // --- 4. Bulk Import Logic ---

        let pendingImportData = null; // Store parsed data before mapping
        let detectedHeaders = [];

        document.getElementById('btn-bulk-import').addEventListener('click', () => {
            document.getElementById('input-bulk-import').click();
        });

        document.getElementById('input-bulk-import').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const filename = file.name.toLowerCase();
            const isCsv = filename.endsWith('.csv');
            const isXlsx = filename.endsWith('.xlsx') || filename.endsWith('.xls');

            if (isCsv) {
                parseCsvForMapping(file);
            } else if (isXlsx) {
                parseXlsxForMapping(file);
            } else {
                alert("Unsupported file format.");
            }

            // Reset input
            event.target.value = '';
        });

        function parseCsvForMapping(file) {
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    pendingImportData = { Nodes: [], Edges: results.data, IsGeneric: true }; // Treat generic CSV as edges initially, we'll map both
                    detectedHeaders = results.meta.fields || [];
                    if (results.data.length > 0 && detectedHeaders.length === 0) {
                        detectedHeaders = Object.keys(results.data[0]);
                    }
                    showMappingModal();
                },
                error: (error) => {
                    alert("Error parsing CSV: " + error.message);
                }
            });
        }

        function parseXlsxForMapping(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });

                    const sheets = {};
                    let firstSheetHeaders = [];

                    workbook.SheetNames.forEach(name => {
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[name]);
                        sheets[name] = jsonData;
                        if (firstSheetHeaders.length === 0 && jsonData.length > 0) {
                             firstSheetHeaders = Object.keys(jsonData[0]);
                        }
                    });

                    // Check if it follows the "two-file style" logic (Nodes and Edges sheets)
                    if (sheets['Nodes'] && sheets['Edges']) {
                         pendingImportData = { Nodes: sheets['Nodes'], Edges: sheets['Edges'], IsGeneric: false };

                         // Get headers from both
                         let nHeaders = sheets['Nodes'].length > 0 ? Object.keys(sheets['Nodes'][0]) : [];
                         let eHeaders = sheets['Edges'].length > 0 ? Object.keys(sheets['Edges'][0]) : [];
                         detectedHeaders = [...new Set([...nHeaders, ...eHeaders])];
                    } else {
                         // Generic table, treat similar to CSV edge-list
                         const firstSheetName = workbook.SheetNames[0];
                         pendingImportData = { Nodes: [], Edges: sheets[firstSheetName], IsGeneric: true };
                         detectedHeaders = firstSheetHeaders;
                    }

                    showMappingModal();
                } catch(error) {
                    alert("Error parsing XLSX: " + error.message);
                }
            };
            reader.readAsBinaryString(file);
        }

        function showMappingModal() {
            const modal = document.getElementById('mapping-modal');
            const fieldsContainer = document.getElementById('mapping-fields');
            const errorsContainer = document.getElementById('mapping-errors');

            fieldsContainer.innerHTML = '';
            errorsContainer.classList.add('hidden');
            errorsContainer.textContent = '';

            const requiredFields = [
                { id: 'map-node-id', label: 'Node ID', isRequired: false }, // Optional if generic edge list where from/to are enough
                { id: 'map-node-label', label: 'Node Label', isRequired: false },
                { id: 'map-node-group', label: 'Node Group (Color)', isRequired: false },
                { id: 'map-edge-from', label: 'Edge From', isRequired: true },
                { id: 'map-edge-to', label: 'Edge To', isRequired: true },
                { id: 'map-edge-label', label: 'Edge Label', isRequired: false }
            ];

            requiredFields.forEach(field => {
                const div = document.createElement('div');

                const label = document.createElement('label');
                label.htmlFor = field.id;
                label.className = "block text-sm font-medium text-gray-700";
                label.textContent = field.label + " ";
                if (field.isRequired) {
                    const span = document.createElement('span');
                    span.className = "text-red-500";
                    span.textContent = "*";
                    label.appendChild(span);
                }
                div.appendChild(label);

                const select = document.createElement('select');
                select.id = field.id;
                select.className = "mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm";

                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                defaultOption.textContent = "-- Select Column --";
                select.appendChild(defaultOption);

                detectedHeaders.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = h;
                    select.appendChild(opt);
                });

                div.appendChild(select);
                fieldsContainer.appendChild(div);

                // Auto-select if there's a strong match (case-insensitive)
                const match = detectedHeaders.find(h => h.toLowerCase() === field.label.toLowerCase() ||
                                                        h.toLowerCase() === field.id.replace('map-', '').replace('-', ' '));
                if (match) {
                    select.value = match;
                } else if (field.id === 'map-edge-from' && detectedHeaders.find(h => h.toLowerCase() === 'from')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'from');
                } else if (field.id === 'map-edge-to' && detectedHeaders.find(h => h.toLowerCase() === 'to')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'to');
                } else if (field.id === 'map-node-id' && detectedHeaders.find(h => h.toLowerCase() === 'id')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'id');
                } else if (field.id === 'map-node-label' && detectedHeaders.find(h => h.toLowerCase() === 'label')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'label');
                }
            });

            modal.classList.remove('hidden');
        }

        document.getElementById('btn-cancel-import').addEventListener('click', () => {
            document.getElementById('mapping-modal').classList.add('hidden');
            pendingImportData = null;
        });

        document.getElementById('btn-commit-import').addEventListener('click', () => {
            const mapNodeId = document.getElementById('map-node-id').value;
            const mapNodeLabel = document.getElementById('map-node-label').value;
            const mapNodeGroup = document.getElementById('map-node-group').value;
            const mapEdgeFrom = document.getElementById('map-edge-from').value;
            const mapEdgeTo = document.getElementById('map-edge-to').value;
            const mapEdgeLabel = document.getElementById('map-edge-label').value;

            const errorsContainer = document.getElementById('mapping-errors');
            errorsContainer.classList.add('hidden');
            errorsContainer.innerHTML = '';
            let errors = [];

            if (!mapEdgeFrom || !mapEdgeTo) {
                errors.push("Edge From and Edge To are required.");
            }

            if (errors.length > 0) {
                errorsContainer.innerHTML = errors.join('<br>');
                errorsContainer.classList.remove('hidden');
                return;
            }

            const mappedNodes = [];
            const mappedEdges = [];
            const seenNodeIds = new Set();

            // Function to safely add a node
            const addMappedNode = (id, label, group) => {
                if (id === undefined || id === null || id === '') return;
                if (!seenNodeIds.has(id)) {
                    const nodeObj = { id: id, label: label || id };
                    if (group) nodeObj.group = group;
                    mappedNodes.push(nodeObj);
                    seenNodeIds.add(id);
                }
            };

            // Process explicit Nodes (if any from two-file format)
            if (pendingImportData.Nodes && pendingImportData.Nodes.length > 0) {
                pendingImportData.Nodes.forEach(row => {
                    const id = mapNodeId ? row[mapNodeId] : row['id'] || row['ID']; // Fallback
                    const label = mapNodeLabel ? row[mapNodeLabel] : row['label'] || row['Label'];
                    const group = mapNodeGroup ? row[mapNodeGroup] : row['group'] || row['Group'];
                    if (id) {
                        addMappedNode(id, label, group);
                    }
                });
            }

            // Process Edges
            if (pendingImportData.Edges && pendingImportData.Edges.length > 0) {
                pendingImportData.Edges.forEach(row => {
                    const from = row[mapEdgeFrom];
                    const to = row[mapEdgeTo];
                    const label = mapEdgeLabel ? row[mapEdgeLabel] : undefined;

                    if (from !== undefined && to !== undefined) {
                        mappedEdges.push({ from: from, to: to, label: label });

                        // Auto-create nodes if they don't exist yet (essential for edge-list style CSV)
                        if (pendingImportData.IsGeneric) {
                            addMappedNode(from, from, null);
                            addMappedNode(to, to, null);
                        }
                    }
                });
            }

            // Check against existing nodes to prevent duplicate ID errors in vis-network
            const existingNodeIds = new Set(nodes.getIds());
            const finalNodesToAdd = mappedNodes.filter(n => !existingNodeIds.has(n.id));

            // Validate references
            const allValidNodeIds = new Set([...existingNodeIds, ...seenNodeIds]);
            mappedEdges.forEach(e => {
                if (!allValidNodeIds.has(e.from) || !allValidNodeIds.has(e.to)) {
                    errors.push(`Edge references missing node: ${e.from} → ${e.to}`);
                }
            });

            if (errors.length > 0) {
                // We show only the first 5 errors to avoid huge modals
                errorsContainer.innerHTML = '';
                const maxErrors = errors.slice(0, 5);
                maxErrors.forEach(errText => {
                    const el = document.createElement('div');
                    el.textContent = errText;
                    errorsContainer.appendChild(el);
                });
                if (errors.length > 5) {
                    const el = document.createElement('div');
                    el.textContent = `...and ${errors.length - 5} more.`;
                    errorsContainer.appendChild(el);
                }

                errorsContainer.classList.remove('hidden');
                return;
            }

            const totalNodes = existingNodeIds.size + finalNodesToAdd.length;
            if (totalNodes > 1000) {
                if (!confirm(`This will result in ${totalNodes} nodes. Physics simulation may be slow. Continue?`)) {
                    return;
                }
            }

            // Commit
            pushHistory();
            nodes.add(finalNodesToAdd);
            edges.add(mappedEdges);

            document.getElementById('mapping-modal').classList.add('hidden');
            pendingImportData = null;
        });

        // --- 5. PNG Export Logic ---

        function exportPng() {
            const networkCanvas = document.querySelector('#network-canvas canvas');
            if (!networkCanvas) return;

            // Create an offscreen canvas to composite vis-network and svg overlay
            const offscreen = document.createElement('canvas');
            offscreen.width = networkCanvas.width;
            offscreen.height = networkCanvas.height;
            const ctx = offscreen.getContext('2d');

            // Optional: fill with background color
            ctx.fillStyle = '#f3f4f6'; // Match app background
            ctx.fillRect(0, 0, offscreen.width, offscreen.height);

            // If there's a background image in tactics mode, we would ideally draw it here.
            // For now, drawing the canvas which has transparent background.
            ctx.drawImage(networkCanvas, 0, 0);

            // Serialize the SVG overlay and draw it onto the canvas
            let svgData = new XMLSerializer().serializeToString(svgOverlay);

            // Nitpick fix: Explicitly inject width and height into the root <svg> tag for better cross-browser compatibility
            svgData = svgData.replace(/<svg([^>]+)>/, `<svg$1 width="${networkCanvas.width}" height="${networkCanvas.height}">`);

            const DOMURL = window.URL || window.webkitURL || window;
            const img = new Image();

            // Note: SVG needs correct dimensions to render properly in image
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = DOMURL.createObjectURL(svgBlob);

            img.onload = function () {
                ctx.drawImage(img, 0, 0, offscreen.width, offscreen.height);
                DOMURL.revokeObjectURL(url);

                // Trigger download
                const link = document.createElement('a');
                link.download = 'graph_snapshot.png';
                link.href = offscreen.toDataURL('image/png');
                link.click();
            };

            // Fallback if SVG fails to load (e.g. cross origin issues with images inside SVG)
            img.onerror = function() {
                console.warn("Failed to composite SVG. Downloading network canvas only.");
                const link = document.createElement('a');
                link.download = 'graph_snapshot.png';
                link.href = networkCanvas.toDataURL('image/png');
                link.click();
            }

            img.src = url;
        }

        document.getElementById('btn-export-png').addEventListener('click', exportPng);

    </script>
</body>
