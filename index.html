<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Builder App - Phase 0 Spike</title>
    <!-- vis-network CSS & JS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <!-- PapaParse and SheetJS for Bulk Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Tailwind for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        #network-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        #svg-overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20; /* SVG sits above the vis-network canvas */
            pointer-events: none; /* Let clicks pass through to the graph by default */
        }
        #pitch-background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5; /* Behind vis-network canvas */
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Parametric Pitch Background -->
        <svg id="pitch-background" xmlns="http://www.w3.org/2000/svg">
            <g id="pitch-graphics"></g>
        </svg>

        <!-- vis-network will mount here -->
        <div id="network-canvas"></div>

        <!-- SVG overlay for tactical zones and freehand annotations -->
        <svg id="svg-overlay" xmlns="http://www.w3.org/2000/svg">
            <!-- Polygons will be injected here dynamically -->
        </svg>

        <!-- Floating UI -->
        <div class="absolute top-4 left-4 z-50 bg-white p-4 rounded shadow">
            <h1 class="font-bold text-lg mb-2">Phase 1 MVP</h1>
            <button id="btn-physics" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Toggle Physics</button>
            <select id="mode-switch" class="mb-2 w-full p-1 border rounded text-sm">
                <option value="systems">Systems Mode</option>
                <option value="tactics">Tactics Mode</option>
            </select>
            <select id="sport-selector" class="mb-2 w-full p-1 border rounded text-sm hidden">
                <option value="soccer">Soccer</option>
                <option value="rugby">Rugby</option>
                <option value="hockey">Hockey</option>
                <option value="cricket">Cricket</option>
            </select>
            <button id="btn-add-node" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Add Node</button>
            <button id="btn-add-edge" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Add Edge</button>
            <button id="btn-add-arrow" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full hidden">Add Arrow (Movement)</button>
            <div class="h-px bg-gray-300 my-2"></div>
            <button id="btn-export-json" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Export JSON</button>
            <button id="btn-import-json" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Import JSON</button>
            <button id="btn-export-png" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Export PNG</button>
            <div class="h-px bg-gray-300 my-2"></div>
            <button id="btn-bulk-import" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded text-sm mb-2 w-full">Bulk Import (CSV/XLSX)</button>

            <input type="file" id="input-import-json" accept=".json" class="hidden" />
            <input type="file" id="input-bulk-import" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" class="hidden" />
        </div>

        <!-- Column Mapping Modal -->
        <div id="mapping-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <div class="mt-3 text-center">
                    <h3 class="text-lg leading-6 font-medium text-gray-900">Map Columns</h3>
                    <div class="mt-2 px-7 py-3 text-left">
                        <div id="mapping-errors" class="text-red-500 text-sm mb-2 hidden"></div>
                        <form id="mapping-form">
                            <!-- Injected fields will go here -->
                            <div id="mapping-fields" class="space-y-3"></div>
                        </form>
                    </div>
                    <div class="items-center px-4 py-3">
                        <button id="btn-commit-import" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
                            Validate & Import
                        </button>
                        <button id="btn-cancel-import" class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Init vis-network with mock data ---

        const nodes = new vis.DataSet([
            { id: 1, label: 'Node 1 (Anchor)', fixed: true, x: 0, y: -100 },
            { id: 2, label: 'Node 2' },
            { id: 3, label: 'Node 3' },
            { id: 4, label: 'Node 4' },
            { id: 5, label: 'Node 5' }
        ]);

        const edges = new vis.DataSet([
            { from: 1, to: 2, dashes: true, arrows: 'to' }, // Testing dashed arrows
            { from: 1, to: 3, smooth: { type: 'curvedCW' }, arrows: 'to' }, // Testing curved lines
            { from: 2, to: 4 },
            { from: 2, to: 5 }
        ]);

        const container = document.getElementById('network-canvas');
        const data = { nodes, edges };

        let physicsEnabled = true;
        let currentEdgeMode = 'standard'; // 'standard' or 'arrow'

        const options = {
            interaction: { dragNodes: true, hover: true },
            manipulation: {
                enabled: false,
                addEdge: function(edgeData, callback) {
                    if (currentEdgeMode === 'arrow') {
                        edgeData.dashes = true;
                        edgeData.arrows = 'to';
                    }
                    callback(edgeData);
                }
            },
            physics: {
                enabled: physicsEnabled,
                barnesHut: { gravitationalConstant: -2000 }
            }
        };

        const network = new vis.Network(container, data, options);

        // --- Phase 3: Node Locking ---

        function setNodeLocked(nodeId, locked) {
            // Also explicitly store x/y when locking so it doesn't drift if physics is enabled elsewhere
            const positions = network.getPositions([nodeId]);
            const pos = positions[nodeId];

            nodes.update({
                id: nodeId,
                fixed: { x: locked, y: locked },
                x: pos.x,
                y: pos.y
            });
        }

        network.on("doubleClick", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                // Toggle lock state
                const isLocked = node.fixed && node.fixed.x === true;
                setNodeLocked(nodeId, !isLocked);

                // Visual feedback (optional)
                const newColor = !isLocked ? '#9ca3af' : undefined; // Gray when locked, default when not
                nodes.update({ id: nodeId, color: newColor });
            }
        });

        // Toggle physics button
        document.getElementById('btn-physics').addEventListener('click', (e) => {
            physicsEnabled = !physicsEnabled;
            network.setOptions({ physics: { enabled: physicsEnabled } });

            const physicsBtn = e.target;
            if (physicsEnabled) {
                physicsBtn.classList.remove('bg-gray-500');
                physicsBtn.classList.add('bg-blue-500');
            } else {
                physicsBtn.classList.remove('bg-blue-500');
                physicsBtn.classList.add('bg-gray-500');
            }
        });

        // --- Phase 3: Parametric Pitch Backgrounds ---

        let currentSport = 'soccer';

        function drawPitch(sport) {
            const pitchGroup = document.getElementById('pitch-graphics');
            pitchGroup.innerHTML = ''; // Clear previous

            // Dimensions in canvas coordinates.
            // Scale: 1 unit = 1 meter approx for layout purposes
            const strokeColor = 'rgba(255, 255, 255, 0.5)';
            const strokeWidth = 2;

            function createLine(x1, y1, x2, y2) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                line.setAttribute('stroke', strokeColor);
                line.setAttribute('stroke-width', strokeWidth);
                return line;
            }

            function createRect(x, y, w, h) {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x); rect.setAttribute('y', y);
                rect.setAttribute('width', w); rect.setAttribute('height', h);
                rect.setAttribute('fill', 'none');
                rect.setAttribute('stroke', strokeColor);
                rect.setAttribute('stroke-width', strokeWidth);
                return rect;
            }

            function createCircle(cx, cy, r) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
                circle.setAttribute('r', r);
                circle.setAttribute('fill', 'none');
                circle.setAttribute('stroke', strokeColor);
                circle.setAttribute('stroke-width', strokeWidth);
                return circle;
            }

            if (sport === 'soccer') {
                const w = 1050; // 105m * 10
                const h = 680;  // 68m * 10
                const cx = 0;
                const cy = 0;

                // Outer bounds (centered at 0,0)
                pitchGroup.appendChild(createRect(-w/2, -h/2, w, h));

                // Halfway line
                pitchGroup.appendChild(createLine(0, -h/2, 0, h/2));

                // Center circle (radius 9.15m = 91.5)
                pitchGroup.appendChild(createCircle(0, 0, 91.5));

                // Penalty areas (16.5m x 40.3m = 165 x 403)
                pitchGroup.appendChild(createRect(-w/2, -403/2, 165, 403));
                pitchGroup.appendChild(createRect(w/2 - 165, -403/2, 165, 403));

            } else if (sport === 'rugby') {
                const w = 1000; // 100m
                const h = 700;  // 70m

                // Outer bounds
                pitchGroup.appendChild(createRect(-w/2, -h/2, w, h));
                // Halfway
                pitchGroup.appendChild(createLine(0, -h/2, 0, h/2));
                // 22m lines
                pitchGroup.appendChild(createLine(-w/2 + 220, -h/2, -w/2 + 220, h/2));
                pitchGroup.appendChild(createLine(w/2 - 220, -h/2, w/2 - 220, h/2));
                // 10m lines
                const dash10 = createLine(-100, -h/2, -100, h/2);
                dash10.setAttribute('stroke-dasharray', '10, 10');
                pitchGroup.appendChild(dash10);
                const dash10b = createLine(100, -h/2, 100, h/2);
                dash10b.setAttribute('stroke-dasharray', '10, 10');
                pitchGroup.appendChild(dash10b);
                // In-goals (22m deep)
                pitchGroup.appendChild(createRect(-w/2 - 220, -h/2, 220, h));
                pitchGroup.appendChild(createRect(w/2, -h/2, 220, h));

            } else if (sport === 'hockey') {
                const w = 914; // 91.4m
                const h = 550; // 55m

                pitchGroup.appendChild(createRect(-w/2, -h/2, w, h));
                pitchGroup.appendChild(createLine(0, -h/2, 0, h/2));
                // 23m lines (approx 22.9m)
                pitchGroup.appendChild(createLine(-w/2 + 229, -h/2, -w/2 + 229, h/2));
                pitchGroup.appendChild(createLine(w/2 - 229, -h/2, w/2 - 229, h/2));

                // Shooting circles (14.63m radius) - approximate as semi-circles with arcs
                const arcL = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                arcL.setAttribute('d', `M ${-w/2},${-146.3} A 146.3 146.3 0 0 1 ${-w/2 + 146.3},0 A 146.3 146.3 0 0 1 ${-w/2},${146.3}`);
                arcL.setAttribute('fill', 'none'); arcL.setAttribute('stroke', strokeColor); arcL.setAttribute('stroke-width', strokeWidth);
                pitchGroup.appendChild(arcL);

                const arcR = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                arcR.setAttribute('d', `M ${w/2},${-146.3} A 146.3 146.3 0 0 0 ${w/2 - 146.3},0 A 146.3 146.3 0 0 0 ${w/2},${146.3}`);
                arcR.setAttribute('fill', 'none'); arcR.setAttribute('stroke', strokeColor); arcR.setAttribute('stroke-width', strokeWidth);
                pitchGroup.appendChild(arcR);

            } else if (sport === 'cricket') {
                const r = 685; // ~137m diameter = 68.5m radius
                pitchGroup.appendChild(createCircle(0, 0, r));

                // Pitch strip (20.12m x 3.05m = 201 x 30)
                const strip = createRect(-201/2, -30/2, 201, 30);
                strip.setAttribute('fill', 'rgba(255,255,255,0.1)');
                pitchGroup.appendChild(strip);

                // Crease lines
                pitchGroup.appendChild(createLine(-201/2 + 12.2, -30, -201/2 + 12.2, 30)); // Popping crease approx
                pitchGroup.appendChild(createLine(201/2 - 12.2, -30, 201/2 - 12.2, 30));
            }
        }

        // Mode Switching
        function setMode(mode, savedSport = null) {
            const physicsBtn = document.getElementById('btn-physics');
            const sportSelector = document.getElementById('sport-selector');

            if (mode === 'tactics') {
                physicsEnabled = false;
                network.setOptions({ physics: { enabled: false } });
                physicsBtn.classList.remove('bg-blue-500');
                physicsBtn.classList.add('bg-gray-500');

                // Show sport selector, arrow button, and draw pitch
                sportSelector.classList.remove('hidden');
                document.getElementById('btn-add-arrow').classList.remove('hidden');
                document.getElementById('app-container').style.backgroundColor = '#4ade80'; // Tailwind green-400 for grass

                if (savedSport) {
                    sportSelector.value = savedSport;
                    currentSport = savedSport;
                }
                drawPitch(currentSport);
                document.getElementById('pitch-background').style.display = 'block';

            } else {
                physicsEnabled = true;
                network.setOptions({ physics: { enabled: true } });
                physicsBtn.classList.remove('bg-gray-500');
                physicsBtn.classList.add('bg-blue-500');

                // Hide sport selector, arrow button, and clear pitch
                sportSelector.classList.add('hidden');
                document.getElementById('btn-add-arrow').classList.add('hidden');
                document.getElementById('app-container').style.backgroundColor = '#f3f4f6';
                document.getElementById('pitch-background').style.display = 'none';
            }
        }

        document.getElementById('mode-switch').addEventListener('change', (e) => {
            setMode(e.target.value);
        });

        document.getElementById('sport-selector').addEventListener('change', (e) => {
            currentSport = e.target.value;
            drawPitch(currentSport);
        });

        // Add Node / Add Edge / Add Arrow
        document.getElementById('btn-add-node').addEventListener('click', () => {
            network.addNodeMode();
        });

        document.getElementById('btn-add-edge').addEventListener('click', () => {
            currentEdgeMode = 'standard';
            network.addEdgeMode();
        });

        document.getElementById('btn-add-arrow').addEventListener('click', () => {
            currentEdgeMode = 'arrow';
            network.addEdgeMode();
        });

        // --- 2. SVG Overlay Logic ---

        const svgOverlay = document.getElementById('svg-overlay');

        // Mock zone data (using internal vis-network canvas coordinates)
        const zones = new vis.DataSet([
            {
                id: 'zone-1',
                points: [[-150, -50], [150, -50], [100, 150], [-100, 150]], // Polygon vertices
                color: 'rgba(239, 68, 68, 0.2)', // Tailwind red-500 semi-transparent
                stroke: '#ef4444'
            }
        ]);

        // Render the zones as SVG polygons
        function renderZoneOverlay() {
            while (svgOverlay.firstChild) {
                svgOverlay.removeChild(svgOverlay.firstChild);
            }

            zones.get().forEach(zone => {
                const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                // The points are in Canvas space, so we store them raw. We transform the whole SVG later.
                poly.setAttribute('points', zone.points.map(p => p.join(',')).join(' '));
                poly.setAttribute('fill', zone.color);
                poly.setAttribute('stroke', zone.stroke);
                poly.setAttribute('stroke-width', '2');
                // If we want the zone to be clickable later, we'd enable pointer-events on the polygon

                svgOverlay.appendChild(poly);
            });

            syncSvgTransform(); // apply current viewport transform immediately
        }

        // Sync the SVG layer's transform to match the vis-network canvas viewport
        function syncSvgTransform() {
            // Get current scale (zoom) and translation (pan) from the network
            const scale = network.getScale();
            const viewPosition = network.getViewPosition();

            // vis-network viewport center is relative to the DOM container center.
            const containerRect = container.getBoundingClientRect();
            const centerX = containerRect.width / 2;
            const centerY = containerRect.height / 2;

            const translateX = centerX - (viewPosition.x * scale);
            const translateY = centerY - (viewPosition.y * scale);

            const transformString = `translate(${translateX}px, ${translateY}px) scale(${scale})`;

            // Apply to overlay
            svgOverlay.style.transformOrigin = '0 0';
            svgOverlay.style.transform = transformString;

            // Apply to pitch background graphics
            const pitchBg = document.getElementById('pitch-background');
            if (pitchBg) {
                pitchBg.style.transformOrigin = '0 0';
                pitchBg.style.transform = transformString;
            }
        }

        // Hook up vis-network events to keep the SVG overlay perfectly in sync
        network.on("zoom", syncSvgTransform);
        network.on("dragging", syncSvgTransform);
        network.on("dragEnd", syncSvgTransform);
        network.on("animation", syncSvgTransform); // needed if physics auto-pans the camera

        // Initial render
        renderZoneOverlay();
        // The network might auto-fit on load, so we need to wait a tick for the initial layout
        network.once("afterDrawing", () => {
             syncSvgTransform();
        });

        // --- 3. JSON Export & Import Logic ---

        function exportGraph() {
            // Get positions to save them properly
            const positions = network.getPositions();

            // Map nodes to include their x and y if physics is disabled
            const currentNodes = nodes.get().map(node => {
                if (positions[node.id]) {
                    return { ...node, x: positions[node.id].x, y: positions[node.id].y };
                }
                return node;
            });

            const currentMode = document.getElementById('mode-switch').value;

            const payload = {
                version: 1,
                mode: currentMode,
                nodes: currentNodes,
                edges: edges.get(),
                zones: zones.get(),
                isPhysicsEnabled: physicsEnabled,
                sport: currentSport
            };

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.setAttribute("href", url);
            a.setAttribute("download", "graph_workspace.json");
            document.body.appendChild(a);
            a.click();
            a.remove();

            window.URL.revokeObjectURL(url);
        }

        function importGraph(jsonString) {
            try {
                const payload = JSON.parse(jsonString);

                if (payload.version !== 1) {
                    console.warn("Importing unversioned or different version graph.", payload.version);
                }

                nodes.clear();
                edges.clear();
                zones.clear();

                nodes.add(payload.nodes);
                edges.add(payload.edges);
                if (payload.zones) {
                    zones.add(payload.zones);
                }

                // Restore mode
                if (payload.mode) {
                    document.getElementById('mode-switch').value = payload.mode;
                    setMode(payload.mode, payload.sport);
                }

                // If the physics was saved as false (maybe they manually turned it off in systems mode)
                if (payload.isPhysicsEnabled === false) {
                    physicsEnabled = false;
                    network.setOptions({ physics: { enabled: false } });
                } else if (payload.isPhysicsEnabled === true) {
                    physicsEnabled = true;
                    network.setOptions({ physics: { enabled: true } });
                }

                // Keep the physics button visually in sync if necessary.
                // Currently it has no active/inactive styling, but if it did, we'd update it here.
                const physicsBtn = document.getElementById('btn-physics');
                if (physicsEnabled) {
                    physicsBtn.classList.remove('bg-gray-500');
                    physicsBtn.classList.add('bg-blue-500');
                } else {
                    physicsBtn.classList.remove('bg-blue-500');
                    physicsBtn.classList.add('bg-gray-500');
                }

                // Re-render zones overlay
                renderZoneOverlay();

            } catch (error) {
                console.error("Failed to import JSON", error);
                alert("Failed to parse JSON file.");
            }
        }

        document.getElementById('btn-export-json').addEventListener('click', exportGraph);

        document.getElementById('btn-import-json').addEventListener('click', () => {
            document.getElementById('input-import-json').click();
        });

        document.getElementById('input-import-json').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    importGraph(e.target.result);
                    // Reset input
                    event.target.value = '';
                };
                reader.readAsText(file);
            }
        });

        // --- 4. Bulk Import Logic ---

        let pendingImportData = null; // Store parsed data before mapping
        let detectedHeaders = [];

        document.getElementById('btn-bulk-import').addEventListener('click', () => {
            document.getElementById('input-bulk-import').click();
        });

        document.getElementById('input-bulk-import').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const filename = file.name.toLowerCase();
            const isCsv = filename.endsWith('.csv');
            const isXlsx = filename.endsWith('.xlsx') || filename.endsWith('.xls');

            if (isCsv) {
                parseCsvForMapping(file);
            } else if (isXlsx) {
                parseXlsxForMapping(file);
            } else {
                alert("Unsupported file format.");
            }

            // Reset input
            event.target.value = '';
        });

        function parseCsvForMapping(file) {
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    pendingImportData = { Nodes: [], Edges: results.data, IsGeneric: true }; // Treat generic CSV as edges initially, we'll map both
                    detectedHeaders = results.meta.fields || [];
                    if (results.data.length > 0 && detectedHeaders.length === 0) {
                        detectedHeaders = Object.keys(results.data[0]);
                    }
                    showMappingModal();
                },
                error: (error) => {
                    alert("Error parsing CSV: " + error.message);
                }
            });
        }

        function parseXlsxForMapping(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });

                    const sheets = {};
                    let firstSheetHeaders = [];

                    workbook.SheetNames.forEach(name => {
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[name]);
                        sheets[name] = jsonData;
                        if (firstSheetHeaders.length === 0 && jsonData.length > 0) {
                             firstSheetHeaders = Object.keys(jsonData[0]);
                        }
                    });

                    // Check if it follows the "two-file style" logic (Nodes and Edges sheets)
                    if (sheets['Nodes'] && sheets['Edges']) {
                         pendingImportData = { Nodes: sheets['Nodes'], Edges: sheets['Edges'], IsGeneric: false };

                         // Get headers from both
                         let nHeaders = sheets['Nodes'].length > 0 ? Object.keys(sheets['Nodes'][0]) : [];
                         let eHeaders = sheets['Edges'].length > 0 ? Object.keys(sheets['Edges'][0]) : [];
                         detectedHeaders = [...new Set([...nHeaders, ...eHeaders])];
                    } else {
                         // Generic table, treat similar to CSV edge-list
                         const firstSheetName = workbook.SheetNames[0];
                         pendingImportData = { Nodes: [], Edges: sheets[firstSheetName], IsGeneric: true };
                         detectedHeaders = firstSheetHeaders;
                    }

                    showMappingModal();
                } catch(error) {
                    alert("Error parsing XLSX: " + error.message);
                }
            };
            reader.readAsBinaryString(file);
        }

        function showMappingModal() {
            const modal = document.getElementById('mapping-modal');
            const fieldsContainer = document.getElementById('mapping-fields');
            const errorsContainer = document.getElementById('mapping-errors');

            fieldsContainer.innerHTML = '';
            errorsContainer.classList.add('hidden');
            errorsContainer.textContent = '';

            const requiredFields = [
                { id: 'map-node-id', label: 'Node ID', isRequired: false }, // Optional if generic edge list where from/to are enough
                { id: 'map-node-label', label: 'Node Label', isRequired: false },
                { id: 'map-node-group', label: 'Node Group (Color)', isRequired: false },
                { id: 'map-edge-from', label: 'Edge From', isRequired: true },
                { id: 'map-edge-to', label: 'Edge To', isRequired: true },
                { id: 'map-edge-label', label: 'Edge Label', isRequired: false }
            ];

            requiredFields.forEach(field => {
                const div = document.createElement('div');

                const label = document.createElement('label');
                label.htmlFor = field.id;
                label.className = "block text-sm font-medium text-gray-700";
                label.textContent = field.label + " ";
                if (field.isRequired) {
                    const span = document.createElement('span');
                    span.className = "text-red-500";
                    span.textContent = "*";
                    label.appendChild(span);
                }
                div.appendChild(label);

                const select = document.createElement('select');
                select.id = field.id;
                select.className = "mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm";

                const defaultOption = document.createElement('option');
                defaultOption.value = "";
                defaultOption.textContent = "-- Select Column --";
                select.appendChild(defaultOption);

                detectedHeaders.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = h;
                    select.appendChild(opt);
                });

                div.appendChild(select);
                fieldsContainer.appendChild(div);

                // Auto-select if there's a strong match (case-insensitive)
                const match = detectedHeaders.find(h => h.toLowerCase() === field.label.toLowerCase() ||
                                                        h.toLowerCase() === field.id.replace('map-', '').replace('-', ' '));
                if (match) {
                    select.value = match;
                } else if (field.id === 'map-edge-from' && detectedHeaders.find(h => h.toLowerCase() === 'from')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'from');
                } else if (field.id === 'map-edge-to' && detectedHeaders.find(h => h.toLowerCase() === 'to')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'to');
                } else if (field.id === 'map-node-id' && detectedHeaders.find(h => h.toLowerCase() === 'id')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'id');
                } else if (field.id === 'map-node-label' && detectedHeaders.find(h => h.toLowerCase() === 'label')) {
                    select.value = detectedHeaders.find(h => h.toLowerCase() === 'label');
                }
            });

            modal.classList.remove('hidden');
        }

        document.getElementById('btn-cancel-import').addEventListener('click', () => {
            document.getElementById('mapping-modal').classList.add('hidden');
            pendingImportData = null;
        });

        document.getElementById('btn-commit-import').addEventListener('click', () => {
            const mapNodeId = document.getElementById('map-node-id').value;
            const mapNodeLabel = document.getElementById('map-node-label').value;
            const mapNodeGroup = document.getElementById('map-node-group').value;
            const mapEdgeFrom = document.getElementById('map-edge-from').value;
            const mapEdgeTo = document.getElementById('map-edge-to').value;
            const mapEdgeLabel = document.getElementById('map-edge-label').value;

            const errorsContainer = document.getElementById('mapping-errors');
            errorsContainer.classList.add('hidden');
            errorsContainer.innerHTML = '';
            let errors = [];

            if (!mapEdgeFrom || !mapEdgeTo) {
                errors.push("Edge From and Edge To are required.");
            }

            if (errors.length > 0) {
                errorsContainer.innerHTML = errors.join('<br>');
                errorsContainer.classList.remove('hidden');
                return;
            }

            const mappedNodes = [];
            const mappedEdges = [];
            const seenNodeIds = new Set();

            // Function to safely add a node
            const addMappedNode = (id, label, group) => {
                if (id === undefined || id === null || id === '') return;
                if (!seenNodeIds.has(id)) {
                    const nodeObj = { id: id, label: label || id };
                    if (group) nodeObj.group = group;
                    mappedNodes.push(nodeObj);
                    seenNodeIds.add(id);
                }
            };

            // Process explicit Nodes (if any from two-file format)
            if (pendingImportData.Nodes && pendingImportData.Nodes.length > 0) {
                pendingImportData.Nodes.forEach(row => {
                    const id = mapNodeId ? row[mapNodeId] : row['id'] || row['ID']; // Fallback
                    const label = mapNodeLabel ? row[mapNodeLabel] : row['label'] || row['Label'];
                    const group = mapNodeGroup ? row[mapNodeGroup] : row['group'] || row['Group'];
                    if (id) {
                        addMappedNode(id, label, group);
                    }
                });
            }

            // Process Edges
            if (pendingImportData.Edges && pendingImportData.Edges.length > 0) {
                pendingImportData.Edges.forEach(row => {
                    const from = row[mapEdgeFrom];
                    const to = row[mapEdgeTo];
                    const label = mapEdgeLabel ? row[mapEdgeLabel] : undefined;

                    if (from !== undefined && to !== undefined) {
                        mappedEdges.push({ from: from, to: to, label: label });

                        // Auto-create nodes if they don't exist yet (essential for edge-list style CSV)
                        if (pendingImportData.IsGeneric) {
                            addMappedNode(from, from, null);
                            addMappedNode(to, to, null);
                        }
                    }
                });
            }

            // Check against existing nodes to prevent duplicate ID errors in vis-network
            const existingNodeIds = new Set(nodes.getIds());
            const finalNodesToAdd = mappedNodes.filter(n => !existingNodeIds.has(n.id));

            // Validate references
            const allValidNodeIds = new Set([...existingNodeIds, ...seenNodeIds]);
            mappedEdges.forEach(e => {
                if (!allValidNodeIds.has(e.from) || !allValidNodeIds.has(e.to)) {
                    errors.push(`Edge references missing node: ${e.from} → ${e.to}`);
                }
            });

            if (errors.length > 0) {
                // We show only the first 5 errors to avoid huge modals
                errorsContainer.innerHTML = '';
                const maxErrors = errors.slice(0, 5);
                maxErrors.forEach(errText => {
                    const el = document.createElement('div');
                    el.textContent = errText;
                    errorsContainer.appendChild(el);
                });
                if (errors.length > 5) {
                    const el = document.createElement('div');
                    el.textContent = `...and ${errors.length - 5} more.`;
                    errorsContainer.appendChild(el);
                }

                errorsContainer.classList.remove('hidden');
                return;
            }

            const totalNodes = existingNodeIds.size + finalNodesToAdd.length;
            if (totalNodes > 1000) {
                if (!confirm(`This will result in ${totalNodes} nodes. Physics simulation may be slow. Continue?`)) {
                    return;
                }
            }

            // Commit
            nodes.add(finalNodesToAdd);
            edges.add(mappedEdges);

            document.getElementById('mapping-modal').classList.add('hidden');
            pendingImportData = null;
        });

        // --- 5. PNG Export Logic ---

        function exportPng() {
            const networkCanvas = document.querySelector('#network-canvas canvas');
            if (!networkCanvas) return;

            // Create an offscreen canvas to composite vis-network and svg overlay
            const offscreen = document.createElement('canvas');
            offscreen.width = networkCanvas.width;
            offscreen.height = networkCanvas.height;
            const ctx = offscreen.getContext('2d');

            // Optional: fill with background color
            ctx.fillStyle = '#f3f4f6'; // Match app background
            ctx.fillRect(0, 0, offscreen.width, offscreen.height);

            // Draw Pitch Background if in Tactics Mode
            if (document.getElementById('mode-switch').value === 'tactics') {
                ctx.fillStyle = '#4ade80'; // grass green
                ctx.fillRect(0, 0, offscreen.width, offscreen.height);

                const pitchBg = document.getElementById('pitch-background');
                if (pitchBg) {
                    let pitchData = new XMLSerializer().serializeToString(pitchBg);
                    pitchData = pitchData.replace(/<svg([^>]+)>/, `<svg$1 width="${networkCanvas.width}" height="${networkCanvas.height}">`);
                    const pBlob = new Blob([pitchData], {type: 'image/svg+xml;charset=utf-8'});
                    const pUrl = window.URL.createObjectURL(pBlob);

                    const pImg = new Image();
                    pImg.src = pUrl;

                    // We must wait for this image to load. To do this synchronously is hard,
                    // we will nest it.
                    pImg.onload = function() {
                        ctx.drawImage(pImg, 0, 0, offscreen.width, offscreen.height);
                        window.URL.revokeObjectURL(pUrl);
                        drawNetworkAndOverlay();
                    };
                    pImg.onerror = function() {
                        drawNetworkAndOverlay();
                    }
                    return; // Exit early and let onload handle the rest
                }
            }

            drawNetworkAndOverlay();

            function drawNetworkAndOverlay() {
                ctx.drawImage(networkCanvas, 0, 0);

                // Serialize the SVG overlay and draw it onto the canvas
                let svgData = new XMLSerializer().serializeToString(svgOverlay);

                // Explicitly inject width and height into the root <svg> tag for better cross-browser compatibility
                svgData = svgData.replace(/<svg([^>]+)>/, `<svg$1 width="${networkCanvas.width}" height="${networkCanvas.height}">`);

                const DOMURL = window.URL || window.webkitURL || window;
                const img = new Image();

                // Note: SVG needs correct dimensions to render properly in image
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const url = DOMURL.createObjectURL(svgBlob);

                img.onload = function () {
                    ctx.drawImage(img, 0, 0, offscreen.width, offscreen.height);
                    DOMURL.revokeObjectURL(url);

                    // Trigger download
                    const link = document.createElement('a');
                    link.download = 'graph_snapshot.png';
                    link.href = offscreen.toDataURL('image/png');
                    link.click();
                };

                // Fallback if SVG fails to load (e.g. cross origin issues with images inside SVG)
                img.onerror = function() {
                    console.warn("Failed to composite SVG. Downloading canvas only.");
                    const link = document.createElement('a');
                    link.download = 'graph_snapshot.png';
                    link.href = offscreen.toDataURL('image/png');
                    link.click();
                }

                img.src = url;
            }
        }

        document.getElementById('btn-export-png').addEventListener('click', exportPng);

    </script>
